<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>DARA logo capture</title>
  <style>
    html, body { margin: 0; background: transparent; }
    #stage { position: relative; width: 1200px; height: 560px; }
    canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  </style>
  <script type="importmap">
    { "imports": {
      "three": "./../public/vendor/three/three.module.min.js",
      "three/addons/": "./../public/vendor/three/addons/"
    } }
  </script>
</head>
<body>
  <div id="stage"><canvas id="c"></canvas></div>
  <script type="module">
    import { initHero } from "../public/js/hero.js";
    const size = new URLSearchParams(location.search).get("size");
    if (size) {
      const [w, h] = size.split("x").map(Number);
      Object.assign(document.getElementById("stage").style, { width: w + "px", height: h + "px" });
    }
    const hero = await initHero(document.getElementById("c"), { capture: true });
    hero.render();
    requestAnimationFrame(() => { hero.render(); window.__ready = true; });
  </script>
</body>
</html>
